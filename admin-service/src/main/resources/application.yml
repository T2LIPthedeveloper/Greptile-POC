server:
  port: 8080

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:h2:mem:mcp_gateway;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mcp:
  security:
    jwt:
      secret: dev-jwt-secret-key-min-32-bytes-long!!
      access-token-ttl-seconds: 3600
      refresh-token-ttl-seconds: 86400
    encryption:
      master-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mcpgateway: INFO
