name: CI

on:
  push:
    branches: [spring/main, spring/phase-b, spring/phase-c, spring/phase-d, spring/phase-e]
  pull_request:
    branches: [spring/main, spring/phase-b, spring/phase-c, spring/phase-d, spring/phase-e]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./gradlew build
      - name: Build Docker image
        run: ./gradlew :admin-service:bootJar
